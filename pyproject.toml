[project]
name = "minicad-site"
version = "0.1.0"
description = "Static MiniCAD website generator"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["markdown-it-py==4.0.0"]

[dependency-groups]
dev = ["ruff>=0.14,<0.16"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
include = ["tools/*.py", "pyproject.toml"]
